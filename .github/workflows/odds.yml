name: Agente de odds

permissions:
  contents: write   # necessário para o passo final poder gravar o estado atualizado

# Nota: o agendamento nativo do GitHub (schedule) foi removido de propósito.
# O disparo é feito externamente pelo cron-job.org, que chama o evento
# workflow_dispatch abaixo a cada 15 minutos, de forma fiável. Ter os dois
# em simultâneo estava a causar execuções sobrepostas e cancelamentos.

on:
  workflow_dispatch:   # disparado pelo cron-job.org (e também manualmente, se quiseres testar)

concurrency:
  group: agente-odds
  cancel-in-progress: false   # se uma execução ainda estiver a correr, a próxima espera em vez de sobrepor

jobs:
  correr-agente:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar a dependência requests
        run: pip install requests

      - name: Correr o script do agente
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agente_odds_movimento.py

      - name: Guardar o estado atualizado de volta no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_odds.json
          if [ -f alertas_movimento.csv ]; then
            git add alertas_movimento.csv
          fi
          git diff --quiet --cached || git commit -m "Atualizar estado das odds"
          git push
